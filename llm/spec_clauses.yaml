# Benchmark: customer acceptance clauses -> gold rules (pcbinspect/spec.py rule language).
# Written to cover the phrasings that occur in workmanship notes and purchase orders: limits stated
# as "shall not exceed" / "up to X acceptable" (fires ABOVE X), thresholds stated as "X or more"
# (fires AT X), units in mm / mil / micron / percent, counts written as words, and actions that are
# implied ("must be removed" = rework) rather than named. "scrap" maps to reject.
# Fields: k=kind (limit default), d=defect, m=measure, op, v=value (mm | % | count), a=action, c=class
- {t: "No shorts are permitted.", d: short, m: always, a: reject}
- {t: "Any open circuit is cause for rejection.", d: open, m: always, a: reject}
- {t: "Nicks that reduce the conductor width by more than 20% are rejectable.", d: mouse_bite, m: width_loss_pct, op: ">", v: 20, a: reject}
- {t: "Conductor width reduction from nicks shall not exceed 10%.", d: mouse_bite, m: width_loss_pct, op: ">", v: 10, a: reject}
- {t: "Spurious copper of 0.25 mm or larger must be removed by rework.", d: spurious_copper, m: size_mm, op: ">=", v: 0.25, a: rework}
- {t: "Pin holes larger than 0.1 mm in diameter are not acceptable.", d: pin_hole, m: size_mm, op: ">", v: 0.1, a: reject}
- {t: "Inspect all boards to Class 3.", k: class, c: 3}
