# Runtime configuration. Paths are relative to `root` (the deployed bundle directory).
root: .
data_dir: var                 # SQLite log + images + learning buffers (created on first run)
designs_dir: config/designs
camera: auto                  # auto | picamera2 | usb | replay
replay_glob: demo/boards/*.jpg
vision_backend: executorch    # executorch | arm-runtime (Arm Optimized-Runtimes YOLO26, Pi 5) | ultralytics (laptop dev)
arm_runtime_lib: ""           # empty = find libarm-yolo26n.so.0 under the runtime's dist/ (deploy/pi_setup.sh builds it)
arm_runtime_model: ""         # empty = find our converted model (a folder with model.bin) under the same dist/
detector_variant: n          # n | s | m: which bare-board detector runs; its own thresholds come with it
#                              (pcbinspect/variants.py). Chosen from the Pi timings.
detector_pte: models/vision/pcb_y26n_xnnpack.pte
detector_pt: models/vision/pcb_y26n.pt
backbone_pte: models/vision/resnet18_patch_xnnpack.pte
llm_pte: models/llm/llama3_2_1b_spinquant.pte          # small model: fallback, and the tokens/s benchmark
advice_llm_pte: models/llm/llama3_2_3b_spinquant.pte   # decides advice and shift questions (falls back to llm_pte)
llm_backend: logits            # decisions read from next-token scores; "runner" = the text runner writing JSON
advice_cause_mode: pointwise   # each candidate cause judged alone with a yes/no question; "list" = pick from a list
llm_tokenizer: models/llm/tokenizer.model
spec_llm_pte: models/llm/llama3_2_3b_spinquant.pte   # reads customer requirements (loaded on first use)
eyetest_dir: assets/eyetest
llm_threads: 4
gpio: true
host: 0.0.0.0
port: 8000
